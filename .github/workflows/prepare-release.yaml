name: Prepare Release

# Opens the release PR for a version: folds every changelog.d/ fragment into
# CHANGELOG.md under the new version heading (and deletes the fragments).
# Merge the PR, then run "SDK Publish" (sdk_publish.yaml) from the merge commit
# with the same version.
#
#   gh workflow run prepare-release.yaml --ref main -f version=v2.1.0
#
# Pre-releases may skip this step: an alpha publishes any commit (source_ref), and its
# changes stay as fragments until the next prepared release.
#
# Each release line carries its own copy of this file under the same name; the
# 0.x line's copy on release/v0 prepares 0.x releases.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare (vX.Y.Z, vX.Y.Z-rc.N or vX.Y.Z-alpha.N)'
        required: true
        type: string

permissions: {}

jobs:
  # Off the environment, so its summary is on the run page while `prepare`
  # waits for approval.
  plan:
    name: Show the plan
    if: github.repository == 'daytona/clients'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show the inputs and what approval will run
        env:
          VERSION_INPUT: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # Git allows ` | < in ref names and the version is unchecked here;
          # `?` is in neither, so a cleaned value never looks like a real one.
          clean() { printf '%s' "$1" | tr '`|<\n\r' '?????'; }
          version=$(clean "${VERSION_INPUT#v}")
          base=$(clean "$GITHUB_REF_NAME")
          requested="**@${TRIGGERING_ACTOR}**"
          [ "$TRIGGERING_ACTOR" = "$ACTOR" ] || requested="${requested} (re-run of @${ACTOR}'s dispatch)"
          {
            echo "## Prepare Release plan — \`v${version}\`"
            echo
            echo "Requested by ${requested} from \`${base}\` @ [\`${GITHUB_SHA:0:12}\`](${SERVER}/${REPO}/commit/${GITHUB_SHA})."
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| \`version\` | \`v${version}\` |"
            echo
            echo "After approval of the \`release\` environment, \`prepare\`:"
            echo
            echo "1. validates \`v${version}\` for this line (no 0.x, stable only from \`main\` and above the highest stable 2.x tag, tag not taken). This plan does not check these rules; a refused version fails at this step, before anything is pushed;"
            echo "2. folds every \`changelog.d/\` fragment into \`CHANGELOG.md\` under a new \`## [${version}]\` heading and deletes the fragments;"
            echo "3. pushes branch \`prepare-release-v${version}\` and opens PR \`chore: prepare release v${version}\` into \`${base}\` as daytonaBot."
            echo
            echo "Nothing is published; after merging, run SDK Publish from the merge commit with \`v${version}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: plan
    if: github.repository == 'daytona/clients'
    runs-on: ubuntu-latest
    # GITHUBBOT_TOKEN lives only in the `release` environment; the run waits
    # for required-reviewer approval before secrets resolve.
    environment: release
    permissions:
      contents: write
    env:
      VERSION_INPUT: ${{ inputs.version }}
      BASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate the version for this line
        id: version
        run: |
          set -euo pipefail
          derived=$(scripts/sdk-version.sh "$VERSION_INPUT")
          # Only a version the publish workflow takes (alpha, rc, stable).
          scripts/release-channel.sh "$VERSION_INPUT" >/dev/null
          version=$(sed -n 's/^version=//p' <<<"$derived")
          case "$version" in
            0.*) echo "::error::${version} is a 0.x version — prepare it from release/v0"; exit 1 ;;
          esac
          # sdk_publish.yaml refuses 2.0.0-rc.1 by name: npm 2.0.0-rc.1 and
          # PyPI 2.0.0rc1 were published before this release line.
          if [ "$version" = 2.0.0-rc.1 ]; then
            echo "::error::2.0.0-rc.1 is taken by SDK packages published before this release line; prepare v2.0.0-rc.2 or later"
            exit 1
          fi
          case "$version" in
            *-*) ;;
            *)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::${version} is a stable version; prepare stable releases from main (dispatched from ${GITHUB_REF})"
                exit 1
              fi
              # No stable 2.x backports (sdk_publish.yaml's gate refuses
              # them): every stable release records its v2.Y.Z tag.
              highest=$(git tag -l 'v2.*' | grep -E '^v2\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1 || true)
              if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" = "$highest" ]; then
                echo "::error::${version} is not above the highest stable 2.x release v${highest}: 2.x publishes no stable backports"
                exit 1
              fi ;;
          esac
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fold changelog fragments into CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/changelog
          python3 scripts/changelog/assemble.py check --dir changelog.d
          python3 scripts/changelog/assemble.py assemble \
            --dir changelog.d --changelog CHANGELOG.md --version "$VERSION" --pr-links \
            --compare-url "https://github.com/${GITHUB_REPOSITORY}/compare/v{prev}...v{version}"
          git --no-pager diff --stat
      - name: Push branch and open the release PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh prefers GH_TOKEN over GITHUB_TOKEN: the PR is created as
          # daytonaBot so PR checks trigger on it (GITHUB_TOKEN-created PRs
          # never trigger workflows).
          GH_TOKEN: ${{ secrets.GITHUBBOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUBBOT_TOKEN is unavailable; refusing to create the release PR with GITHUB_TOKEN"
            exit 1
          fi
          branch="prepare-release-v${VERSION}"
          git config user.name "Daytona Release Bot"
          git config user.email "153830314+daytonaBot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A CHANGELOG.md changelog.d
          git commit -s -m "chore: prepare release v${VERSION}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "$branch"
          gh pr create \
            --title "chore: prepare release v${VERSION}" \
            --body "Folds the changelog fragments into CHANGELOG.md for v${VERSION}. After merging, run SDK Publish from the merge commit with version v${VERSION}." \
            --base "$BASE_BRANCH" \
            --head "$branch"
