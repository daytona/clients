name: v0 pin bump

# Keeps the 0.x release that SDK 2.x bundles as `Daytona().v0`
# (scripts/v0-sdk-version) close to the newest 0.x release. The migration tool
# moves 0.x code onto that bundle and refuses projects on a newer 0.x minor, so
# a stale pin turns migrating into downgrading.
#
# Daily (and on demand), `detect` compares the pin with the newest stable
# v0.X.Y tag. When a newer one exists and no bump PR is open (and no earlier
# bump branch for that tag exists, so a declined bump is not reopened daily),
# `prepare` writes the new tag and commit into the pin and regenerates the
# migration tool's v0 data (upgrade/mapping/mapping.json `v0Version` /
# `v0Exports`, both package copies, upgrade/MIGRATION.md). It also runs the 0.x
# surface check, whose output goes into the PR body: a 0.x method with no
# mapping row needs one, added by hand in that PR; its CI shows whatever else
# the bump needs. `open-pr` commits those files and opens the pull request.
# Nothing publishes: the new pin ships with the next 2.x release.
#
# Same split as sdk_publish.yaml: `prepare` runs the repository's scripts and
# npm with no token and no environment; `open-pr`, the only job on the
# `release` environment (its GITHUBBOT_TOKEN, so the pull request's checks
# run), runs no repository code: it copies prepare's files over a fresh
# checkout, commits, pushes and opens the PR. A run asks for approval only when
# there is a release to bump to.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: v0-pin-bump
  cancel-in-progress: false

jobs:
  detect:
    name: Newest 0.x release
    # The bump targets main, so it only runs there.
    if: github.repository == 'daytona/clients' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/v0-sdk-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: newest
        name: Compare the pin with the newest stable v0.X.Y tag
        env:
          GH_TOKEN: ${{ github.token }}   # read-only
        run: |
          set -euo pipefail
          pinned=$(sed -n '1p' scripts/v0-sdk-version | tr -d '[:space:]')
          newest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v0.*' \
            | sed 's|.*refs/tags/||' | grep -E '^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          echo "pinned: $pinned, newest 0.x release: ${newest:-none}"
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$pinned" "$newest" | sort -V | tail -1)" = "$pinned" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --search 'head:chore/v0-pin-' --limit 1000 --json headRefName \
            --jq '[.[].headRefName | select(startswith("chore/v0-pin-"))] | join(" ")')
          if [ -n "$open" ]; then
            echo "::notice::a pin bump PR is already open ($open); merge or close it first"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "chore/v0-pin-${newest}" >/dev/null; then
            # A branch whose PR was closed is a declined bump; a branch with no
            # PR at all is a run that failed after its push, so it is retried.
            if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "chore/v0-pin-${newest}" --state all --json number --jq '.[].number')" ]; then
              echo "::notice::branch chore/v0-pin-${newest} has a closed PR (a declined bump); delete the branch to open a new one"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::branch chore/v0-pin-${newest} has no PR; retrying"
          fi
          echo "tag=$newest" >> "$GITHUB_OUTPUT"

  prepare:
    name: Bump the pin to ${{ needs.detect.outputs.tag }}
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Point the pin at the release and regenerate the tool's v0 data
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$TAG" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/v0-src"
          # Only a release of the 0.x line: the tag's commit must be on release/v0.
          git -C "$RUNNER_TEMP/v0-src" fetch --quiet --depth 1000 origin release/v0
          if ! git -C "$RUNNER_TEMP/v0-src" merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::${TAG} is not on release/v0; not bumping the pin to it"
            exit 1
          fi
          printf '%s\n%s\n' "$TAG" "$(git -C "$RUNNER_TEMP/v0-src" rev-parse HEAD)" > scripts/v0-sdk-version
          bash scripts/resolve-v0-tag.sh --verify
          npm ci --prefix sdk-typescript --no-audit --no-fund --ignore-scripts
          # Writes v0Version and v0Exports, then reports what else the bump needs.
          status=0
          node upgrade/scripts/check-v0-surface.mjs --src "$RUNNER_TEMP/v0-src" --write-v0-exports > "$RUNNER_TEMP/surface.txt" 2>&1 || status=$?
          node upgrade/scripts/sync-mapping.mjs
          node upgrade/scripts/gen-guide.mjs
          cat "$RUNNER_TEMP/surface.txt"
          mkdir -p "$RUNNER_TEMP/bump/files"
          for file in scripts/v0-sdk-version upgrade/mapping/mapping.json upgrade/typescript/src/mapping.json \
            upgrade/python/src/daytona_upgrade/mapping.json upgrade/MIGRATION.md; do
            mkdir -p "$RUNNER_TEMP/bump/files/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/bump/files/$file"
          done
          # Users see a different 0.x behind Daytona().v0: a changelog fragment.
          mkdir -p "$RUNNER_TEMP/bump/files/changelog.d"
          # Fragment ids allow no dots (scripts/changelog/assemble.py).
          fragment="changelog.d/v0-pin-${TAG//./-}.changed.md"
          printf '%s\n' "**\`Daytona().v0\` runs the 0.x SDK ${TAG}** — SDK 2.x now bundles ${TAG} as its v0 namespace, and the migration tool accepts projects on it." \
            > "$RUNNER_TEMP/bump/files/$fragment"
          cp "$RUNNER_TEMP/surface.txt" "$RUNNER_TEMP/bump/surface.txt"
          echo "$status" > "$RUNNER_TEMP/bump/surface-status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v0-pin-bump
          path: ${{ runner.temp }}/bump/
          if-no-files-found: error
          retention-days: 7

  open-pr:
    name: Open the pin bump PR for ${{ needs.detect.outputs.tag }}
    needs: [detect, prepare]
    runs-on: ubuntu-latest
    # GITHUBBOT_TOKEN lives only in the `release` environment.
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: v0-pin-bump
          path: ${{ runner.temp }}/bump
      # Only these six paths are taken from the artifact; git, gh and the
      # shell are the only programs this job runs.
      - name: Commit the bump, push the branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUBBOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUBBOT_TOKEN is unavailable; a PR opened with GITHUB_TOKEN would run no checks"
            exit 1
          fi
          files=(scripts/v0-sdk-version upgrade/mapping/mapping.json upgrade/typescript/src/mapping.json
            upgrade/python/src/daytona_upgrade/mapping.json upgrade/MIGRATION.md "changelog.d/v0-pin-${TAG//./-}.changed.md")
          for file in "${files[@]}"; do cp "$RUNNER_TEMP/bump/files/$file" "$file"; done
          surface_status=$(cat "$RUNNER_TEMP/bump/surface-status")
          branch="chore/v0-pin-${TAG}"
          git config user.name "Daytona Release Bot"
          git config user.email "153830314+daytonaBot@users.noreply.github.com"
          gh auth setup-git   # git's credential helper reads GH_TOKEN; no token on argv
          # A retry (detect found the branch with no PR) opens the PR for the
          # branch as it was pushed; the branch is never rewritten.
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git checkout -b "$branch"
            git add -- "${files[@]}"
            git commit -s -m "chore(sdk): bundle 0.x ${TAG} as the v0 namespace"
            git push origin "$branch"
          fi
          {
            echo "Points \`scripts/v0-sdk-version\` at ${TAG}, the newest 0.x release, so SDK 2.x bundles it as \`Daytona().v0\` and the migration tool accepts projects on it. Regenerated: the tool's \`v0Version\` / \`v0Exports\` and upgrade/MIGRATION.md."
            echo
            if [ "$surface_status" = 0 ]; then
              echo "The 0.x surface check passes: every public 0.x method at ${TAG} has a mapping row."
            else
              echo "**The 0.x surface check fails** — add the mapping rows it names (upgrade/mapping/mapping.json, then \`node upgrade/scripts/sync-mapping.mjs\` and \`node upgrade/scripts/gen-guide.mjs\`) in this PR:"
              echo
              echo '```'
              head -c 60000 "$RUNNER_TEMP/bump/surface.txt"
              echo '```'
            fi
            echo
            echo "CI shows what else the bump needs. The new pin ships with the next 2.x release."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" \
            --title "chore(sdk): bundle 0.x ${TAG} as the v0 namespace" --body-file "$RUNNER_TEMP/body.md"
