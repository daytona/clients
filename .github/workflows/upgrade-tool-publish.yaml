name: Publish daytona-upgrade

# Publishes the migration tool, npm `@daytona/upgrade` and PyPI
# `daytona-upgrade` (upgrade/). Manual only, and a dry run unless `dry_run` is
# set to false. Dispatched from the 2.x line (`release/v2`, or `main` once 2.x
# is the default branch), it builds, tests and packs both packages from a
# release tag `daytona-upgrade-vX.Y.Z[-(alpha|beta|rc).N]` that must point at
# a commit on the dispatch branch; the published version is the tag's. In a
# dry run the publish jobs are skipped.
#
# One-time setup before the first real publish: register this workflow
# (`upgrade-tool-publish.yaml`) as a trusted publisher for both names — a PyPI
# "pending publisher" for project `daytona-upgrade`, and on npm, after the
# name exists, a trusted publisher for package `@daytona/upgrade` — both with
# environment `release`.
#
# Same split as sdk_publish.yaml: the build job runs package scripts with a
# read-only token and no OIDC; the publish jobs never check out source, take
# only the built artifacts, and hold the only `id-token: write`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, daytona-upgrade-vX.Y.Z[-(alpha|beta|rc).N], on a commit of the dispatch branch (PyPI gets the PEP 440 form of the version)'
        required: true
        type: string
      targets:
        description: 'Which registries'
        required: true
        default: both
        type: choice
        options: [both, npm, pypi]
      dry_run:
        description: 'Build and test only; publish nothing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: upgrade-tool-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.tag }} (dry run ${{ inputs.dry_run }})
    runs-on: ubuntu-latest
    # Publishing builds only reviewed code: dispatched from the 2.x line, and
    # the release tag must point at a commit on that branch (checked below).
    outputs:
      npm_version: ${{ steps.versions.outputs.npm }}
      pypi_version: ${{ steps.versions.outputs.pypi }}
      npm_dist_tag: ${{ steps.versions.outputs.dist_tag }}
    steps:
      - name: Require dispatch from the 2.x line
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/release/v2) ;;
            *) echo "::error::dispatch this workflow from release/v2 (or main once 2.x is the default branch), got '$GITHUB_REF'"; exit 1 ;;
          esac
      - name: Require a daytona-upgrade release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *$'\n'* || "$TAG" == *$'\r'* ]]; then
            echo "::error::tag must not contain a newline or carriage return"; exit 1
          fi
          if [[ ! "$TAG" =~ ^daytona-upgrade-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::tag must be daytona-upgrade-vX.Y.Z or daytona-upgrade-vX.Y.Z-(alpha|beta|rc).N, got '$TAG'"; exit 1
          fi
          echo "version=${TAG#daytona-upgrade-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag's commit is on the dispatch branch
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 above fetched every branch, so origin/<branch> is local
          # (a separate fetch would be unauthenticated: persist-credentials is off).
          if ! git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            echo "::error::$TAG points at $(git rev-parse HEAD), which is not on $BRANCH: publish only reviewed code"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Derive versions and the npm dist-tag
        id: versions
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          pypi=$(printf '%s' "$VERSION" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          case "$VERSION" in
            *-alpha.*) tag=alpha ;;
            *-beta.*) tag=beta ;;
            *-rc.*) tag=next ;;
            *) tag=latest ;;
          esac
          {
            echo "npm=$VERSION"
            echo "pypi=$pypi"
            echo "dist_tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse a placeholder docs URL
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          placeholder=$(python3 -c "import json; print(json.load(open('upgrade/mapping/mapping.json'))['docs']['placeholder'])")
          if [ "$placeholder" != "False" ]; then
            echo "::error::upgrade/mapping/mapping.json docs.placeholder is true: set docs.base to the public migration guide first"
            exit 1
          fi
      - name: Mapping copies and guide are current
        run: |
          set -euo pipefail
          npm ci --prefix typescript --no-audit --no-fund --ignore-scripts
          node upgrade/scripts/sync-mapping.mjs --check
          node upgrade/scripts/gen-guide.mjs --check
          node upgrade/scripts/check-v2-surface.mjs
      - name: Build, test and pack the npm package
        working-directory: upgrade/typescript
        env:
          NPM_VERSION: ${{ steps.versions.outputs.npm }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm version --no-git-tag-version --allow-same-version "$NPM_VERSION"
          npm run typecheck
          npm test
          npm run build
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm"
          tar -tzf "$RUNNER_TEMP"/npm/*.tgz | grep -x 'package/dist/mapping.json' >/dev/null
          tar -xOzf "$RUNNER_TEMP"/npm/*.tgz package/package.json | node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.equal(JSON.parse(fs.readFileSync(0, "utf8")).version, process.env.NPM_VERSION);
          '
      - name: Test, then build the PyPI package
        working-directory: upgrade/python
        env:
          PYPI_VERSION: ${{ steps.versions.outputs.pypi }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          # Test against the committed lock first; stamping the version
          # afterwards changes only the built artifacts, not uv.lock.
          uv sync --locked
          uv run pytest -q
          python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^version = "[^"]*"$', f'version = "{os.environ["PYPI_VERSION"]}"', s, count=1)
          assert n == 1, "pyproject.toml has no version line"
          p.write_text(s)
          PY
          uv build --out-dir "$RUNNER_TEMP/pypi"
          test -f "$RUNNER_TEMP/pypi/daytona_upgrade-${PYPI_VERSION}-py3-none-any.whl"
          python -m zipfile -l "$RUNNER_TEMP"/pypi/*.whl | grep 'daytona_upgrade/mapping.json' >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-npm
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-pypi
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: error
          retention-days: 3

  publish-pypi:
    name: Publish daytona-upgrade ${{ needs.build.outputs.pypi_version }} to PyPI
    needs: build
    if: ${{ !inputs.dry_run && (inputs.targets == 'both' || inputs.targets == 'pypi') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — the ONLY job perm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-pypi
          path: dist/
      - run: ls -l dist
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish daytona-upgrade ${{ needs.build.outputs.npm_version }} to npm
    needs: build
    if: ${{ !inputs.dry_run && (inputs.targets == 'both' || inputs.targets == 'npm') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC token for npm Trusted Publishing — the ONLY job perm
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Same publisher setup as sdk_publish.yaml: an exact, reviewed
      # npm (Trusted Publishing needs >= 11.5.1), and setup-node's
      # `always-auth=` line dropped (npm >= 7 warns on it).
      - name: Install a Trusted-Publishing-capable npm (pinned)
        run: |
          set -euo pipefail
          sed -i '/^always-auth=/d' "${NPM_CONFIG_USERCONFIG:?setup-node registry-url did not export NPM_CONFIG_USERCONFIG}"
          npm install -g npm@11.21.1
          npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upgrade-npm
          path: pack/
      - name: Publish to npm (OIDC)
        # No NODE_AUTH_TOKEN: OIDC trusted publishing authenticates the run.
        # The registry is pinned on the command line, not taken from the
        # tarball's package.json, because this job holds the credential.
        env:
          NPM_DIST_TAG: ${{ needs.build.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          tgz=$(ls pack/*.tgz)
          [ "$(echo "$tgz" | wc -l)" -eq 1 ] || { echo "::error::expected exactly one tarball, got: $tgz"; exit 1; }
          case "$NPM_DIST_TAG" in
            alpha|beta|next|latest) ;;
            *) echo "::error::gate produced no usable npm dist-tag ('${NPM_DIST_TAG}')"; exit 1 ;;
          esac
          # "./" is load-bearing: npm reads a bare `pack/x.tgz` as GitHub
          # shorthand (`git ls-remote ssh://git@github.com/pack/x.tgz.git`).
          npm publish "./$tgz" --registry https://registry.npmjs.org --access public --ignore-scripts --tag "$NPM_DIST_TAG"
