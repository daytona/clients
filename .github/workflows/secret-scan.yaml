name: Secret scan

# gitleaks over the commits a pull request or a push adds (rules:
# .gitleaks.toml): the CI twin of the pre-commit and pre-push hooks, for
# commits made without them. Same script and pinned gitleaks as the hooks
# (scripts/secret-scan.sh). Findings are redacted in the log.
on:
  push:
    branches: [main, release/v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned gitleaks
        run: scripts/secret-scan.sh install-bin
      - name: Hook tests
        run: bash scripts/secret-scan_test.sh
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/secret-scan.sh range "$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            scripts/secret-scan.sh range "$BEFORE..$AFTER"
          else
            # A new branch or a force push: there is no previous tip to diff
            # against, so scan the pushed commit itself.
            scripts/secret-scan.sh range -1 "$AFTER"
          fi
