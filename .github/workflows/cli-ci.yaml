name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'contract/**'
      - 'sdk-python/tests/fixtures/dockerignore-*.json'
      - '.github/workflows/cli-ci.yaml'
  pull_request:
    paths:
      - 'cli/**'
      - 'contract/**'
      - 'sdk-python/tests/fixtures/dockerignore-*.json'
      - '.github/workflows/cli-ci.yaml'

permissions:
  contents: read

jobs:
  cli:
    name: CLI vet, test, format, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::unformatted Go files — run 'gofmt -w .' and re-commit"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cli
          path: cli/coverage.out
          retention-days: 14
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: cli
      - name: Cross-build the release targets
        run: ./hack/build.sh
