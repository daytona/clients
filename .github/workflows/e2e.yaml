name: E2E

# Live end-to-end tests of both SDKs against a Daytona deployment. They need
# the DAYTONA_API_KEY secret and, for a deployment other than the default, the
# DAYTONA_V2_API_URL repository variable (the only URL variable the 2.x SDKs
# read). DAYTONA_API_URL belongs to the 0.x line's workflows and is not read
# here. One key serves both release lines: keys are shared between
# the 0.x and 2.x APIs. Secrets are not available to pull requests from forks, so
# there the suite reports a skip instead of failing; a maintainer runs it
# before merging.
#
# A pull request that depends on API changes that are not deployed yet is
# expected to fail here until they are: keep it a draft until then.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use a repository variable for a custom 2.x test deployment;
  # otherwise test against the default 2.x API.
  DAYTONA_V2_API_URL: ${{ vars.DAYTONA_V2_API_URL || 'https://api.daytona.com' }}
  DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}

jobs:
  check-secret:
    name: Check API key availability
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.check.outputs.run_e2e }}
    steps:
      - id: check
        run: |
          if [ -z "$DAYTONA_API_KEY" ]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DAYTONA_API_KEY is not available (fork PR or unset); skipping the live E2E suite."
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ${{ matrix.sdk }} SDK E2E
    needs: check-secret
    if: needs.check-secret.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [py, ts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: ./e2e/run.sh ${{ matrix.sdk }}
