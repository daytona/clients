name: Contract types

# The SDKs and the CLI vendor wire types generated from contract/*.json.
# Regenerate them and fail when the committed copy differs: a contract update
# must come with its regenerated types (and the SDK changes they force).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'contract/**'
      - 'scripts/gen-contract-types.sh'
      - 'typescript/scripts/gen-contract.mjs'
      - 'typescript/package.json'
      - 'typescript/package-lock.json'
      - 'typescript/src/v2/gen/**'
      - 'python/gen-contract.sh'
      - 'python/gen/**'
      - 'python/src/daytona/v2/_gen/**'
      - 'cli/hack/gen.sh'
      - 'cli/gen/**'
      - '.github/workflows/contracts.yaml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-types:
    name: vendored wire types match contract/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/gen-contract-types.sh --check
