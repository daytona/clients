[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "daytona"
version = "0.0.0-dev"
authors = [
    { name = "Daytona Platforms Inc.", email = "support@daytona.io"  },
]
description = "Python SDK for Daytona"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "python-dotenv>=1.2.4,<2.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "Deprecated>=1.3.1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "httpx-ws>=0.9.0,<1.0.0",
    "aiohttp>=3.14.5,<4.0.0",
    "wsproto>=1.3.2,<2.0.0",
    "aiofiles>=25.1.0,<25.2.0",
    "toml>=0.10.2,<0.11.0",
    "obstore>=0.11.1,<0.12.0",
    "python-multipart>=0.0.32,<0.1.0",
    "typing-extensions>=4.16.0",
    "opentelemetry-api>=1.45.2,<2.0.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2.0.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.66b2",
    "urllib3>=2.8.0,<3.0.0",
    "python-socketio[asyncio-client,client]>=5.18.1,<6.0.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["daytona", "sdk"]
license = {text = "Apache-2.0"}

[tool.deptry]
exclude = ["scripts", "tests"]
extend_exclude = [".venv", "dist", "build", ".pytest_cache", "__pycache__"]
