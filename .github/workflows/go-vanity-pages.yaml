name: Deploy Go vanity Pages

# Serves the Go vanity import path of the 2.x Go SDK from GitHub Pages: the
# go-import meta tag that lets `go get go.daytona.com/sdk/v2` find sdk-go/ in this
# repository. The site is generated by scripts/go-vanity-site.sh and deploys
# only from main. The 0.x Go modules keep their github.com/daytona/clients/...
# paths and never read it.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/go-vanity-site.sh'
      - '.github/workflows/go-vanity-pages.yaml'
  pull_request:
    paths:
      - 'scripts/go-vanity-site*.sh'
      - '.github/workflows/go-vanity-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

# Only main pushes and dispatches share the deploy group; any other run (a PR,
# a dispatch from another branch) gets its own and cannot supersede a deploy.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'go-vanity-pages' || format('go-vanity-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    name: Go vanity site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash scripts/go-vanity-site_test.sh

  deploy:
    name: Deploy
    needs: test
    if: github.repository == 'daytona/clients' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the site
        run: bash scripts/go-vanity-site.sh go-vanity-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: go-vanity-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the served go-import tag
        # Pages can take a short while to serve a new deployment. Module paths
        # are answered by 404.html with status 404, which go reads all the
        # same, so the status is not checked (no curl -f).
        run: |
          want='<meta name="go-import" content="go.daytona.com/sdk git https://github.com/daytona/clients sdk-go">'
          for attempt in $(seq 1 30); do
            if curl -sSL --connect-timeout 5 --max-time 20 "https://go.daytona.com/sdk/v2?go-get=1" | grep -qxF "$want"; then
              echo "go.daytona.com serves the go-import tag"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://go.daytona.com/sdk/v2?go-get=1 does not serve: $want"
          exit 1
