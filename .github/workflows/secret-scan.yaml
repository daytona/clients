name: Secret scan

# gitleaks over the commits a pull request or a push adds (rules:
# .gitleaks.toml): the CI twin of the pre-commit and pre-push hooks, for
# commits made without them. Same script and pinned gitleaks as the hooks
# (scripts/secret-scan.sh). Findings are redacted in the log.
# Blocks merging only as a required status check in branch protection. The
# `main` trigger takes effect once this file is on main (when 2.x moves there).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded push run (cancelled, or pending and replaced) would leave its
  # commits unscanned: the next push only scans from the previous tip onward.
  # Each push run gets its own group; only PR runs supersede each other.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # A branch deletion pushes no commits.
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned gitleaks
        run: scripts/secret-scan.sh install-bin
      - name: Hook tests
        run: bash scripts/secret-scan_test.sh
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/secret-scan.sh range "$PR_BASE..$PR_HEAD"
          else
            scripts/secret-scan.sh ci-push "$BEFORE" "$AFTER" "$BRANCH"
          fi
