name: Contract types

# The SDKs and the CLI vendor wire types generated from contract/*.json.
# Regenerate them and fail when the committed copy differs: a contract update
# must come with its regenerated types (and the SDK changes they force).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'contract/**'
      - 'scripts/gen-contract-types.sh'
      - 'sdk-typescript/scripts/gen-contract.mjs'
      - 'sdk-typescript/package.json'
      - 'sdk-typescript/package-lock.json'
      - 'sdk-typescript/src/v2/gen/**'
      - 'sdk-python/gen-contract.sh'
      - 'sdk-python/gen/**'
      - 'sdk-python/src/daytona/v2/_gen/**'
      - 'cli/hack/gen.sh'
      - 'cli/gen/**'
      - '.github/workflows/contracts.yaml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-types:
    name: vendored wire types match contract/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Generator jar integrity gate
        run: bash sdk-python/gen/gen-contract_test.sh
      - run: scripts/gen-contract-types.sh --check
