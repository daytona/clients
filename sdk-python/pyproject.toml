[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daytona"
version = "2.0.0a1"
description = "Daytona Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Daytona Platforms Inc.", email = "support@daytona.io" },
]
keywords = ["daytona", "sandbox", "sdk", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.16.0",
  "httpx>=0.24",
  "pydantic>=2.14.2,<3",
  "typing-extensions>=4.6",
  "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/daytona/clients"
Repository = "https://github.com/daytona/clients"
Issues = "https://github.com/daytona/clients/issues"

[project.optional-dependencies]
# The bundled v0 namespace's runtime dependencies (`Daytona().v0`). Empty in the
# repository: scripts/bundle-v0.sh fills it at publish time from the
# bundled v0 release's own pyproject, pinning its generated API clients to that
# release.
v0-sdk = []
otel = [
  "opentelemetry-api>=1.45.2,<2",
]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "respx>=0.20",
  # Pin lint rules for reproducible checks; update the version and any required
  # lint fixes together.
  "ruff==0.17.3",
  "mypy>=2.4.1",
  "opentelemetry-sdk>=1.27,<2",
]

[tool.hatch.build]
# The publish-time v0 bundle is git-ignored (never committed), and hatch skips
# VCS-ignored files unless they are declared artifacts: without this, wheel and
# sdist would silently ship without `daytona.v0`.
artifacts = ["src/daytona/v0/"]

[tool.hatch.build.targets.wheel]
packages = ["src/daytona"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  # The two generator scripts the tests import (the sync-surface drift check
  # and the sensitive-field rule), so the sdist's test suite collects.
  "/gen/gen_sync.py",
  "/gen/mark_sensitive.py",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# src/daytona/v0 is the v0 SDK, bundled at publish time from daytona/clients
# (scripts/bundle-v0.sh) and never committed: it is not ours to lint.
extend-exclude = ["src/daytona/v2/_gen", "src/daytona/v0", "gen"]

[tool.ruff.lint]
extend-select = ["ANN401", "PGH003", "B009", "B010", "TID251"]
# Retain the existing typing.Dict/List/Optional annotation style.
ignore = ["UP006", "UP007", "UP035", "UP045", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# Generated from the async surface by gen/gen_sync.py. UP037 misreads the
# `Literal['x']` annotations ast.unparse emits as quoted forward references.
"src/daytona/v2/_sync/*.py" = ["UP037"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "assert only with proof — parse or narrow instead; if unavoidable, justify at the site"
"unittest.mock.patch".msg = "test through a real seam — this SDK uses respx at the httpx transport"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/daytona"]
# The bundled v0 SDK (publish-time copy, never committed) is typed by its own
# project, not by this gate.
exclude = ["src/daytona/v0/"]
# Existing default-code findings need a separate source-fix migration; this gate adds the Any policies.
disable_error_code = ["arg-type", "assignment", "return-value", "union-attr"]
warn_return_any = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "daytona.v2._gen.*"
# Generated from the OpenAPI contract by openapi-generator (pydantic models):
# the generated helpers carry explicit Any and are never hand-edited, so the
# package is excluded from the type-evidence gates.
disallow_any_explicit = false
ignore_errors = true

[[tool.mypy.overrides]]
module = ["daytona.v0", "daytona.v0.*"]
# The bundled v0 SDK (see `exclude` above): absent from a source checkout, and
# typed by its own project when present. The root client imports it lazily.
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "daytona.v2.lsp"
# LSP symbol responses are open-vocabulary wire data with no stable typed shape.
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "daytona.v2._core"
# The json.loads stub returns Any despite its JSON-only runtime result.
warn_return_any = false

[tool.coverage.run]
# Generated wire models (see [tool.ruff] extend-exclude); not SDK code paths.
# src/daytona/v0 is the bundled v0 SDK (publish-time copy, never committed).
omit = ["src/daytona/v2/_gen/*", "src/daytona/v0/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "timing: asserts tight real-time budgets (tens of ms) that fail on a loaded machine; CI runs these serially, after the parallel pass",
]
