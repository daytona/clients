name: CI passed

# One check that reports on every pull request, so branch protection can
# require it even though most CI workflows are path-filtered (requiring those
# directly would block every pull request that does not touch their paths).
# `CI passed` waits for every other `pull_request` workflow run on the head
# commit and succeeds only if each one that ran succeeded (skipped and neutral
# count as passed; a workflow whose paths did not match never starts and is
# not waited for). Logic: scripts/ci-passed.sh.
#
# Not counted:
# - this workflow itself;
# - E2E: it runs against a live deployment and is expected to fail while a
#   pull request depends on API changes that are not deployed yet, so it stays
#   visible but does not block merging;
# - checks that are not `pull_request` workflow runs: third-party apps (cubic,
#   FOSSA, DCO), CodeQL default setup, and the CLA workflow
#   (`pull_request_target`), which is required on its own.
#
# A re-run of a counted workflow re-runs this check when it completes
# (ci-passed-rerun.yaml); re-running `CI passed` by hand also works.
#
# Reuse on another base branch: copy this file (keep the name ci-passed.yaml;
# the re-run helper looks it up by name) and scripts/ci-passed.sh, then change
# `branches` and set CI_PASSED_IGNORE to that branch's own non-blocking
# workflow files; add the branch's counted workflow names to
# ci-passed-rerun.yaml on main and require `CI passed` in the branch's ruleset.
# For release/v0 that is `branches: ['release/v0']`, CI_PASSED_IGNORE
# `.github/workflows/ci-passed.yaml .github/workflows/e2e_pr_tests.yaml
# .github/workflows/ax_evals.yaml` (its E2E, and the label-triggered,
# informational AX evals), and `[PR] Validate clients` and
# `[CI] AX evals config` in the re-run list.
on:
  pull_request:
    branches: [main]

permissions:
  actions: read # list the workflow runs on the head commit
  contents: read

concurrency:
  group: ci-passed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-passed.sh
          sparse-checkout-cone-mode: false
      - name: Wait for the other workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CI_PASSED_IGNORE: .github/workflows/ci-passed.yaml .github/workflows/e2e.yaml
          CI_PASSED_TIMEOUT: '3600'
        run: scripts/ci-passed.sh "$REPO" "$SHA"
