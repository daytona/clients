name: Examples CI

# Type-checks the examples against the SDK sources in this repository and runs
# their offline tests (a fake client, no API access): `examples/run-examples.sh
# check`. Runs whenever an example or either SDK changes, so an SDK change that
# breaks an example fails here instead of on a user's first run.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - '.github/workflows/examples-ci.yaml'
  pull_request:
    paths:
      - 'examples/**'
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - '.github/workflows/examples-ci.yaml'

permissions:
  contents: read

jobs:
  examples:
    name: Examples type checks and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the TypeScript SDK the examples link to
        working-directory: sdk-typescript
        run: npm ci && npm run build
      - name: Install the Python SDK with its dev extras
        working-directory: sdk-python
        run: python -m venv .venv && .venv/bin/python -m pip install -e ".[dev]"
      - name: Type checks and offline tests
        run: bash examples/run-examples.sh check
