enableInlineHunks: true

nodeLinker: node-modules

# Supply chain: reject packages published less than 7 days ago (10080 minutes)
npmMinimalAgeGate: 10080

# Supply chain: dependency build scripts are off. Packages that genuinely need one are
# allow-listed in the root package.json under dependenciesMeta.<name>.built.
enableScripts: false

# YN0004 is "lists build scripts, but all build scripts have been disabled". As a warning a
# new native dependency would install un-built and only fail at runtime, so it is an error:
# adding one forces a deliberate choice about the allow-list above.
logFilters:
  - code: YN0004
    level: error
