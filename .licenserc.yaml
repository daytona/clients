header:
  # The CLI is licensed under AGPL-3.0 (see cli/LICENSE). The rest of the repo
  # defaults to Apache-2.0 (see LICENSE / COPYRIGHT).
  - license:
      spdx-id: AGPL-3.0
      copyright-owner: Daytona Platforms Inc.
      content: |
        Copyright Daytona Platforms Inc.
        SPDX-License-Identifier: AGPL-3.0
      pattern: |
        Copyright (\d{4} )?Daytona Platforms Inc\.
        SPDX-License-Identifier: AGPL-3\.0
    paths:
      - 'cli/**/*.go'
      - 'cli/**/*.sh'
    paths-ignore:
      # Generated from contract/ by cli/hack/gen.sh.
      - 'cli/gen/**'
      - '**/dist/**'
    comment: never

  - license:
      spdx-id: Apache-2.0
      copyright-owner: Daytona Platforms Inc.
      content: |
        Copyright Daytona Platforms Inc.
        SPDX-License-Identifier: Apache-2.0
      pattern: |
        Copyright (\d{4} )?Daytona Platforms Inc\.
        SPDX-License-Identifier: Apache-2\.0
    paths:
      - 'sdk-python/**/*.py'
      - 'sdk-python/**/*.sh'
      - 'sdk-typescript/**/*.ts'
      - 'sdk-typescript/**/*.mts'
      - 'sdk-typescript/**/*.cts'
      - 'sdk-typescript/**/*.js'
      - 'sdk-typescript/**/*.mjs'
      - 'sdk-typescript/**/*.cjs'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'upgrade/**/*.py'
      - 'upgrade/**/*.sh'
      - 'upgrade/**/*.ts'
      - 'upgrade/**/*.mjs'
      - 'upgrade/**/*.cjs'
      - 'upgrade/**/*.js'
      - 'e2e/**'
    paths-ignore:
      # Generated output — regenerated from contract/ (scripts/gen-contract-types.sh)
      # or from package.json (sdk-typescript/scripts/stamp-version.mjs). Every one
      # carries a "generated" notice instead. (The generated synchronous Python
      # surface, sdk-python/src/daytona/v2/_sync/, emits this header itself.)
      - 'sdk-python/src/daytona/v2/_gen/**'
      - 'sdk-typescript/src/v2/gen/api.ts'
      - 'sdk-typescript/src/v2/gen/toolbox.ts'
      - 'sdk-typescript/src/v2/gen/api-enums.ts'
      - 'sdk-typescript/src/v2/gen/toolbox-enums.ts'
      - 'sdk-typescript/src/version.ts'
      # The v0 namespace is bundled at publish time from a 0.x release and
      # never committed; it carries that release's own headers.
      - 'sdk-python/src/daytona/v0/**'
      - 'sdk-typescript/src/v0/**'
      # Vendored third-party lint rules (MIT, see sdk-typescript/lint/anti-slop/LICENSE).
      - 'sdk-typescript/lint/anti-slop/**'
      # Migration-tool test inputs and expected outputs are sample user code,
      # compared byte for byte; they carry no header.
      - 'upgrade/python/tests/fixtures/**'
      - 'upgrade/typescript/tests/fixtures/**'
      - 'upgrade/typescript/tests/fake-sdk/**'
      - '**/node_modules/**'
      - '**/dist/**'
      - '**/build/**'
      - '**/.venv/**'
    comment: never
