name: '[PR] AX evals (2027.dev)'

# On-demand agent-experience evals: a coding agent on 2027.dev uses the SDK/CLI built
# from the PR head and is graded on whether it gets the task done. Informational only.
#
# Trigger (requires write access to the repo):
#   - add the `ax-eval` label to a PR
#   - comment `/ax-eval` (changed SDKs), `/ax-eval all`, or `/ax-eval python go ...`
# Prompts and setup scripts live in hack/ax-evals and are stored on 2027; they are
# synced from main by ax_evals_config.yaml, so a PR is evaluated with main's prompts.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  plan:
    name: Plan
    # Label events check out and run the PR's hack/ax-evals code, so only same-repo
    # PRs (whose authors already have write access) may get that far; fork PRs never
    # reach the checkout. Comment events always run main's code.
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'ax-eval' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/ax-eval'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: hack/ax-evals
      - id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/hack/ax-evals/plan.js`)
            await run({ github, context, core })

  eval:
    name: ${{ matrix.eval.title }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        eval: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: hack/ax-evals
      # team2027/evals-action is a composite wrapper around `actions/github-script@v9`
      # (a tag, which this repo's SHA-pinning policy rejects), so run its script
      # through our own pinned github-script with the same inputs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: team2027/evals-action
          ref: 18bd0381b4a80ba7357de0330762d7cfb6e5e670 # v0.8.0
          path: .evals-action
          persist-credentials: false
      - id: eval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          EVALS_API_KEY: ${{ secrets.EVALS_API_KEY }}
          EVALS_API_BASE_URL: https://2027.dev/evals
          EVALS_PROMPT_ID: ${{ matrix.eval.promptId }}
          # 2027 does not pass template vars to setup scripts, but exposes urlMap as
          # URL_MAP; hack/ax-evals/setup/_common.sh reads the commit under test from it.
          EVALS_URL_MAP: '{"git-ref.invalid": "https://${{ needs.plan.outputs.sha }}.invalid"}'
          EVALS_TEMPLATE_VARS: ''
          EVALS_DEPLOYMENT_URL: ''
          EVALS_WAIT_TIMEOUT_MINUTES: '60' # 2027 can queue runs for 25+ minutes
          EVALS_POLL_INTERVAL_SECONDS: '20'
          EVALS_TIMEOUT_FAILS: 'false'
          EVALS_SKIP_COMMENT: 'true'
          EVALS_SKIP_STATUS: 'true'
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.evals-action/scripts/run.js`)
            await run({ core, github, context })
      - name: Save result
        if: always()
        env:
          EVALS_API_KEY: ${{ secrets.EVALS_API_KEY }}
          NAME: ${{ matrix.eval.name }}
          RUN_ID: ${{ steps.eval.outputs.run-id }}
          FINAL_STATUS: ${{ steps.eval.outputs.final-status }}
          OUTCOME: ${{ steps.eval.outputs.outcome }}
          REPORT_URL: ${{ steps.eval.outputs.report-url }}
          REPORT_JSON: ${{ steps.eval.outputs.report-json }}
          FAILURE_REASON: ${{ steps.eval.outputs.failure-reason }}
        run: node hack/ax-evals/save-result.js "result/${NAME}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ax-eval-${{ matrix.eval.name }}
          path: result/${{ matrix.eval.name }}.json
          retention-days: 7

  report:
    name: Report
    needs: [plan, eval]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Serialize comment writes per PR; comment.js still lets the newest run win.
    concurrency:
      group: ax-evals-report-${{ needs.plan.outputs.pr }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: hack/ax-evals
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ax-eval-*
          path: ${{ runner.temp }}/ax-results
          # One flat directory of <eval>.json files: download-artifact skips the
          # per-artifact subdirectory when only one artifact matches.
          merge-multiple: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AX_MATRIX: ${{ needs.plan.outputs.matrix }}
          AX_SHA: ${{ needs.plan.outputs.sha }}
          AX_PR: ${{ needs.plan.outputs.pr }}
          AX_RESULTS_DIR: ${{ runner.temp }}/ax-results
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/hack/ax-evals/report.js`)
            await run({ github, context, core })
