name: Upgrade tool CI

# The daytona-upgrade migration tool (upgrade/): both packages' gates, the shared mapping against the pinned 0.x SDK, and the
# pinned 0.x examples upgraded and type-checked against SDK 2.x.
on:
  push:
    branches: [main]
    paths:
      - 'upgrade/**'
      - 'scripts/v0-sdk-version'
      - 'scripts/**'
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - '.github/workflows/upgrade-tool-ci.yaml'
      - '.github/workflows/sdk_publish.yaml'
      - '.github/workflows/prepare-release.yaml'
      - 'scripts/test-upgrade.sh'
  pull_request:
    paths:
      - 'upgrade/**'
      - 'scripts/v0-sdk-version'
      - 'scripts/**'
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - '.github/workflows/upgrade-tool-ci.yaml'
      - '.github/workflows/sdk_publish.yaml'
      - '.github/workflows/prepare-release.yaml'
      - 'scripts/test-upgrade.sh'

permissions:
  contents: read

concurrency:
  group: upgrade-tool-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mapping:
    name: Mapping, guide and SDK surface coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the SDK compiler dependency
        working-directory: sdk-typescript
        run: npm ci --no-audit --no-fund
      - name: Script regressions (root export scanner, migration notes)
        run: node --test upgrade/scripts/*.test.mjs
      - name: Package copies of the mapping are current
        run: node upgrade/scripts/sync-mapping.mjs --check
      - name: MIGRATION.md is current
        run: node upgrade/scripts/gen-guide.mjs --check
      - name: Every public 0.x method at the pinned tag has a mapping entry
        run: |
          set -euo pipefail
          tag=$(bash scripts/resolve-v0-tag.sh --verify)
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/v0-src"
          node upgrade/scripts/check-v0-surface.mjs --src "$RUNNER_TEMP/v0-src"
      - name: Every v2 suggestion names existing SDK calls and arguments
        run: node upgrade/scripts/check-v2-surface.mjs

  typescript:
    name: npm daytona-upgrade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upgrade/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upgrade/typescript/package-lock.json
      - name: Type-check, build and pack
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm pack --dry-run --ignore-scripts
      # Check dependency installation and the built CLI on the oldest supported Node major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install and run the built CLI on Node 20
        run: |
          set -euo pipefail
          node --version
          consumer=$(mktemp -d)
          tarball=$(npm pack --ignore-scripts --pack-destination "$consumer" --silent)
          npm install --prefix "$consumer" --engine-strict --ignore-scripts --no-audit --no-fund "$consumer/$tarball"
          "$consumer/node_modules/.bin/daytona-upgrade" --version
          node dist/cli.js --version
          node dist/cli.js --help >/dev/null
          work=$(mktemp -d) && cp -r tests/fixtures/named-imports/input/. "$work/"
          node dist/cli.js "$work" --yes --force
          diff -r tests/fixtures/named-imports/expected "$work"

  # The suite is CPU-bound (ts-morph projects per test): split it across runners, and vitest uses every core within each.
  typescript-tests:
    name: npm daytona-upgrade tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upgrade/typescript
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upgrade/typescript/package-lock.json
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test -- --shard="$SHARD/3"

  python:
    name: PyPI daytona-upgrade (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upgrade/python
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          uv sync --locked
      # ruff checks source, not the interpreter (target-version is pinned): once is enough.
      - name: Lint
        if: matrix.python == '3.13'
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check, test and build
        run: |
          set -euo pipefail
          uv run basedpyright
          uv run pytest -q -n auto
          uv build --out-dir "$RUNNER_TEMP/dist"

  examples-typescript:
    name: Pinned 0.x TypeScript examples upgraded and type-checked against 2.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk-typescript/package-lock.json
            upgrade/typescript/package-lock.json
      - name: Build the 2.x TypeScript SDK with the pinned v0 bundle
        run: |
          set -euo pipefail
          tag=$(bash scripts/resolve-v0-tag.sh --verify)
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/v0-src"
          DAYTONA_V0_SRC_VERIFIED=1 bash scripts/bundle-v0.sh --lang typescript --src "$RUNNER_TEMP/v0-src" "$tag"
          (cd sdk-typescript && npm install --no-audit --no-fund && npm run build \
            && mkdir -p "$RUNNER_TEMP/sdk-ts" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk-ts")
      - name: Upgrade the examples and type-check them
        run: |
          set -euo pipefail
          bash upgrade/scripts/check-examples.sh --src "$RUNNER_TEMP/v0-src" \
            --ts-tarball "$(ls "$RUNNER_TEMP"/sdk-ts/*.tgz)" --work "$RUNNER_TEMP/examples"
      - name: Run the tool's example tests against the pinned examples
        working-directory: upgrade/typescript
        env:
          DAYTONA_UPGRADE_V0_EXAMPLES: ${{ runner.temp }}/v0-src/examples
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx vitest run tests/examples.test.ts

  examples-python:
    name: Pinned 0.x Python examples upgraded and type-checked against 2.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the 2.x Python SDK with the pinned v0 bundle
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv build
          tag=$(bash scripts/resolve-v0-tag.sh --verify)
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/v0-src"
          DAYTONA_V0_SRC_VERIFIED=1 bash scripts/bundle-v0.sh --lang python --src "$RUNNER_TEMP/v0-src" "$tag"
          (cd sdk-python && python -m build --wheel --outdir "$RUNNER_TEMP/sdk-py")
      - name: Upgrade the examples and type-check them
        run: |
          set -euo pipefail
          bash upgrade/scripts/check-examples.sh --src "$RUNNER_TEMP/v0-src" \
            --py-wheel "$(ls "$RUNNER_TEMP"/sdk-py/*.whl)" --work "$RUNNER_TEMP/examples"

  # Independent of the type-check above and about as long: its own runner.
  examples-python-tests:
    name: Python tool tests against the pinned 0.x examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch the pinned 0.x examples
        run: |
          set -euo pipefail
          python -m pip install --upgrade uv
          tag=$(bash scripts/resolve-v0-tag.sh --verify)
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/v0-src"
      # Three long tests over the whole corpus: one worker each.
      - name: Run the tool's example tests against the pinned examples
        working-directory: upgrade/python
        env:
          DAYTONA_UPGRADE_V0_EXAMPLES: ${{ runner.temp }}/v0-src/examples
        run: uv run --locked pytest -q -n 3 tests/test_examples.py
