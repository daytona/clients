name: Deploy Go vanity Pages

# The site serves the 0.x Go modules on release/v0; main (the 2.x line) has no
# copy of this workflow.
on:
  push:
    branches:
      - release/v0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Runs from other branches deploy nothing; give them their own group so they
# cannot cancel an in-progress deploy from release/v0.
concurrency:
  group: ${{ github.ref == 'refs/heads/release/v0' && 'pages' || format('pages-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  deploy:
    # Only release/v0 publishes the site, including manual runs.
    if: github.repository == 'daytona/clients' && github.ref == 'refs/heads/release/v0'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOMAIN: github.com/daytona/clients
      REPO: daytona/clients
      BRANCH: release/v0
      # Set to "true" only after DNS for $DOMAIN points at GitHub Pages.
      EMIT_CNAME: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate vanity site
        run: bash hack/go-vanity/generate-site.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hack/go-vanity/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
