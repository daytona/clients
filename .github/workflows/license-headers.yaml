name: License headers

# Every source file carries the SPDX header for its license: AGPL-3.0 under
# cli/, Apache-2.0 elsewhere (.licenserc.yaml, LICENSE, COPYRIGHT). Generated
# files are exempt. Fix locally with `license-eye -c .licenserc.yaml header fix`.
on:
  push:
    branches: [main, release/v2]
  pull_request:

permissions:
  contents: read

jobs:
  license-check:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check license headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4
        with:
          token: ${{ github.token }}
          config: .licenserc.yaml
          mode: check
