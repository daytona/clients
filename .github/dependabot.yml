# Dependabot reads this file only from the default branch (main), so it
# configures version updates for both release lines:
#   - 2.x (main): entries without `target-branch`.
#   - 0.x (release/v0): entries with `target-branch: release/v0`. The copy of
#     this file on release/v0 is ignored by Dependabot.
#
# Volume control: weekly runs with one group per entry. On 2.x the groups take
# minor and patch updates and majors arrive as individual PRs so each one gets
# its own review; the 0.x entries keep the grouping they had on release/v0
# (everything grouped, Go majors ignored). Actions stay pinned to full commit
# SHAs; Dependabot bumps the SHA and the trailing `# vX.Y.Z` comment together.
version: 2
updates:
  # ---------------------------------------------------------------------------
  # 2.x line (main)
  # ---------------------------------------------------------------------------

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # TypeScript SDK (@daytona/sdk).
  - package-ecosystem: npm
    directory: /sdk-typescript
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      typescript-sdk:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keep @types/node aligned with the oldest Node the package supports
      # (`engines`); bump its major together with that floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7's package has no JavaScript compiler API, which ts-jest,
      # openapi-typescript (scripts/gen-contract.mjs) and our own compiler-API
      # code need. Remove once ts-jest and openapi-typescript support it:
      # https://github.com/kulshekhar/ts-jest/issues/5366
      # https://github.com/openapi-ts/openapi-typescript/issues/2841
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  # TypeScript upgrade tool (daytona-upgrade on npm).
  - package-ecosystem: npm
    directory: /upgrade/typescript
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      upgrade-typescript:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  # Pinned codegen tooling for sdk-python/gen-contract.sh. The Contracts workflow
  # regenerates the client, so a bump that changes generated output fails CI.
  - package-ecosystem: npm
    directory: /sdk-python/gen
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-gen-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Runnable examples: no lockfile (installed fresh), so only bump a range
  # once the latest release falls outside it.
  - package-ecosystem: npm
    directory: /examples
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  # Python SDK (daytona on PyPI).
  - package-ecosystem: uv
    directory: /sdk-python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-sdk:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Python upgrade tool (daytona-upgrade on PyPI).
  - package-ecosystem: uv
    directory: /upgrade/python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      upgrade-python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Daytona CLI.
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cli:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # ---------------------------------------------------------------------------
  # 0.x line (release/v0) -- maintenance only. Same groups and ignores as the
  # config that lived on release/v0, plus the target branch. These groups take
  # majors too.
  # ---------------------------------------------------------------------------

  - package-ecosystem: github-actions
    target-branch: release/v0
    directories:
      - /
      - /.github/actions/setup-toolchain
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    target-branch: release/v0
    directories:
      - /
      - /sdk-typescript
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-prod:
        patterns:
          - "*"
    ignore:
      # Keep @types/node aligned with the node-version CI pins; a major ahead of the
      # runtime typechecks against APIs that are not there. Bump it with a Node upgrade.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Same TypeScript 7 hold as the 2.x /sdk-typescript entry (ts-jest).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # nx majors wait for @nx-go/nx-go: 4.x pulls @nx/devkit with an nx <=23
      # peer, and its nx 24 support is only a beta so far.
      - dependency-name: "nx"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@nx/*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    target-branch: release/v0
    directories:
      - /sdk-python
      - /api-client-python
      - /api-client-python-async
      - /toolbox-api-client-python
      - /toolbox-api-client-python-async
      - /analytics-api-client-python
      - /analytics-api-client-python-async
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      pip-prod:
        patterns:
          - "*"
    ignore:
      # The generated clients only use dateutil.parser, which works on 2.x and
      # 3.x; a 3.x floor would force every 0.x SDK user onto dateutil 3.
      - dependency-name: "python-dateutil"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    target-branch: release/v0
    directories:
      - /cli
      - /api-client-go
      - /sdk-go
      - /toolbox-api-client-go
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      gomod-prod:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
